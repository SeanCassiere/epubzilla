name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm --dir frontend test
      - name: Build
        run: pnpm build:frontend
      - name: No hand-written model type mirrors (ADR-0006)
        run: |
          if grep -rnE "(interface|type) +(Book|Metadata|SpineItem|NavPoint|Resource|ChapterContent|ContentFormat|EpubVersion|CoreError|ValidationIssue|Severity)\b *[={]" frontend/src; then
            echo "::error::Model types must be imported from @bindings (crates/core/bindings), never redefined."
            exit 1
          fi

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # tauri::generate_context! requires frontendDist to exist at compile time.
      - name: Build frontend dist
        run: pnpm install --frozen-lockfile && pnpm build:frontend
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: TypeScript bindings are up to date
        run: |
          cargo test -p epubzilla-core export_bindings
          git diff --exit-code crates/core/bindings/ \
            || { echo "::error::crates/core/bindings/ is stale — run 'cargo test -p epubzilla-core export_bindings' and commit."; exit 1; }

  perf:
    # Enforces the performance budgets in docs/contracts/core-api.md
    # (release build; the test is #[ignore]d so plain `cargo test` stays fast).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run perf budgets
        run: cargo test -p epubzilla-core --release --test perf_budgets -- --ignored --nocapture

  epubcheck:
    # Validates every EPUB the writer produces (fixtures land with M0.6).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install epubcheck
        run: |
          curl -fsSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.2.1/epubcheck-5.2.1.zip
          unzip -q epubcheck.zip
      - name: Generate fixture EPUBs
        run: cargo test -p epubzilla-core --test epubcheck_fixtures
      - name: Run epubcheck
        run: |
          shopt -s nullglob
          fixtures=(target/epubcheck-fixtures/*.epub)
          if [ ${#fixtures[@]} -eq 0 ]; then
            echo "::error::No fixture EPUBs found — the writer must produce fixtures (M0.6)."
            exit 1
          fi
          fail=0
          for f in "${fixtures[@]}"; do
            echo "== epubcheck $f"
            java -jar epubcheck-5.2.1/epubcheck.jar "$f" || fail=1
          done
          exit $fail
