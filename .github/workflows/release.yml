name: Release

on:
  push:
    tags:
      - "v*"
  # Dispatched at a tag ref by the "Cut release" workflow (tags pushed with
  # GITHUB_TOKEN don't trigger `push` workflows). github.ref_name is the tag
  # either way. Only dispatch this at a v* tag ref.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Windows and Linux targets are temporarily disabled (macOS-only
        # releases for now — CI still tests on Linux). To re-enable, add:
        #   - platform: ubuntu-latest # AppImage + deb + rpm
        #     args: ""
        #   - platform: windows-latest # msi + nsis
        #     args: ""
        # and restore the "Tauri system dependencies (Linux)" apt step
        # (list lives in ci.yml's rust job).
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Only used on macOS; harmless elsewhere.
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile

      - name: Verify updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if grep -q 'REPLACE_WITH_PRODUCTION_MINISIGN_PUBLIC_KEY' crates/app/tauri.conf.json; then
            echo "::error::Replace the updater public-key placeholder before releasing."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::Updater signing secrets are not configured."
            exit 1
          fi

      - name: Build and upload release artifacts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/app
          tagName: ${{ github.ref_name }}
          releaseName: "epubzilla v__VERSION__"
          releaseDraft: true
          prerelease: false
          releaseBody: |
            > [!NOTE]
            > Installers are currently unsigned at the platform level. On
            > macOS, right-click the app and choose "Open" the first time to
            > bypass Gatekeeper. On Windows, SmartScreen may warn — choose
            > "More info" > "Run anyway".
          generateReleaseNotes: true
          uploadUpdaterJson: true
          retryAttempts: 3
          args: ${{ matrix.args }}

      # This is the final gate while releases have one active target. When
      # parallel platform jobs return, move it to a needs: build job so it
      # observes the complete, merged manifest from every target.
      - name: Inspect updater manifest before draft review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          [ "$(printf '%s\n' "$assets" | awk '$0 == "latest.json" { count++ } END { print count + 0 }')" -eq 1 ] \
            || { echo "::error::release must contain exactly one latest.json"; exit 1; }
          printf '%s\n' "$assets" | grep -Eq '\.dmg$' \
            || { echo "::error::normal macOS installer is missing"; exit 1; }
          printf '%s\n' "$assets" | grep -Eq '\.app\.tar\.gz$' \
            || { echo "::error::macOS updater artifact is missing"; exit 1; }
          printf '%s\n' "$assets" | grep -Eq '\.app\.tar\.gz\.sig$' \
            || { echo "::error::updater signature is missing"; exit 1; }
          gh release download "$RELEASE_TAG" --pattern latest.json --dir updater-inspection
          jq -e --arg version "${RELEASE_TAG#v}" '.version == $version' updater-inspection/latest.json
          jq -e --arg tag "$RELEASE_TAG" '
            (.platforms | length) == 1 and
            (all(.platforms[];
              (.url | contains("/download/" + $tag + "/")) and
              (.signature | type == "string" and length > 0)))
          ' updater-inspection/latest.json
