name: Release

on:
  push:
    tags:
      - "v*"
  # Dispatched at a tag ref by the "Cut release" workflow (tags pushed with
  # GITHUB_TOKEN don't trigger `push` workflows). github.ref_name is the tag
  # either way. Only dispatch this at a v* tag ref.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: ubuntu-latest # AppImage + deb
            args: ""
          - platform: windows-latest # msi + nsis
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Only used on macOS; harmless elsewhere.
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile

      - name: Build and upload release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/app
          tagName: ${{ github.ref_name }}
          releaseName: "epubzilla v__VERSION__"
          releaseDraft: true
          prerelease: false
          releaseBody: |
            > [!NOTE]
            > Builds are currently unsigned. On macOS, right-click the app and
            > choose "Open" the first time to bypass Gatekeeper. On Windows,
            > SmartScreen may warn — choose "More info" > "Run anyway".
          generateReleaseNotes: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}
